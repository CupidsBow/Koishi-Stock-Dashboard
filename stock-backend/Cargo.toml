[package]
name = "stock-backend"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 16
lto = false
incremental = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
akshare = "0.1.14"
chrono = "0.4"
tower-http = { version = "0.6", features = ["cors", "fs"] }
anyhow = "1"